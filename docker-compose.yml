version: "3.8"

services:
  app:
    build: .
    container_name: easywrite_app
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENV=production
    volumes:
      - ./:/app:ro

  nginx:
    image: nginx:stable-alpine
    container_name: easywrite_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
